services:
  flightforms:
    build: .
    container_name: flightforms
    restart: unless-stopped
    ports:
      # Loopback only: Caddy on the host proxies localhost:8030. Docker's
      # published ports bypass the host firewall, so "8030:8030" would expose
      # plain HTTP (no TLS, no Caddy limits) on the public interface.
      - "127.0.0.1:8030:8030"
    env_file: .env
    environment:
      - ENVIRONMENT=production
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ./src/flightforms/templates:/app/src/flightforms/templates:ro
      - ./src/flightforms/mappings:/app/src/flightforms/mappings:ro
    networks:
      - shared-services
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  shared-services:
    external: true
